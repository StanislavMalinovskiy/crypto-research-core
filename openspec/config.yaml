schema: spec-driven

context: |
  Crypto Research Core is a research-first crypto signal evaluation system.
  Baseline: Java 25, Spring Boot 4.1.1, Spring Modulith 2.1.1, Maven,
  synchronous Spring MVC, Spring Data JDBC/JdbcClient, PostgreSQL and Flyway.
  It remains one repository, one Maven module, one deployable JAR and one database.
  Package root: io.cryptoresearch. Modules: kernel, marketdata, risk, wallet,
  signal and evaluation.
  Read AGENTS.md and the selected workflow before planning or applying work.
  Read the affected change when the selected route requires one, and accepted specs, affected module documents and
  nearest module guides, applicable ADRs, and relevant code/tests before editing.
  MULTIAGENT TRIVIAL/NORMAL and bounded outcome-blind approved-budget probes require no dummy OpenSpec change; DEFAULT retains its
  existing OpenSpec policy. Follow the selected workflow's tier boundaries.
  Follow AGENTS.md task-impact triggers for Architecture, Tech Stack, Testing,
  Operations and Reproducibility; resolve missing or ambiguous references first.
  Read docs/PROJECT_SUMMARY.md only for onboarding, product orientation or task
  relevance, and Roadmap/Delivery Plan when product direction/stage work needs them.

rules:
  proposal:
    - State explicit non-goals and affected modules.
    - Do not add production dependencies or change module boundaries silently.
  specs:
    - Use testable SHALL requirements with WHEN, THEN and AND scenarios.
    - Describe externally verifiable behavior, not internal Java class names.
  design:
    - Record module ownership, transaction boundaries and verification strategy.
    - Justify every new production dependency and infrastructure component.
  tasks:
    - Order tasks so architecture and tests can be verified incrementally.
    - Include documentation and exact verification commands.

operations:
  apply:
    guidance:
      - Preserve unrelated user changes. In MULTIAGENT Builder reports verification evidence without editing OpenSpec checkboxes; explicitly assigned owner-authorized documentation/instruction paths are permitted; Architect updates verified task checkboxes in DOCS_CLOSE after APPROVE. DEFAULT Control retains its workflow ownership. Never mark partial, deferred or unverified behavior complete.
  archive:
    guidance:
      - Archive only through the authorized OpenSpec CLI after strict validation, applicable scope verification (full gate for integration-triggering changes) and the selected workflow's approval and closure requirements; in MULTIAGENT the scoped checkpoint, post-checks and recovery remain mandatory. DEFAULT retains its independent gate and ownership. No manual move or skip-sync bypass.
