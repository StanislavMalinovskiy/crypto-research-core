spring:
  application:
    name: crypto-research-core
  datasource:
    url: ${CRYPTO_RESEARCH_DB_URL:jdbc:postgresql://localhost:5432/crypto_research}
    username: ${CRYPTO_RESEARCH_DB_USERNAME:crypto_research}
    password: ${CRYPTO_RESEARCH_DB_PASSWORD:crypto_research}
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
