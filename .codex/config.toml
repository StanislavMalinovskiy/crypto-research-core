model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

# Exact boolean true manually selects native Codex MULTIAGENT for a new task.
# False, missing or invalid selects fail-closed DEFAULT; agents never edit this switch.
# Orca is outside this project workflow unless the user explicitly requests it.
[agents]
  enabled = true
  max_concurrent_threads_per_session = 3
  max_depth = 1
  default_subagent_model = "gpt-5.6-terra"
  default_subagent_reasoning_effort = "medium"

  [mcp_servers.idea]
    url = "http://127.0.0.1:64342/stream"
