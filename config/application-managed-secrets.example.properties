# Copy these keys into application-managed-secrets.properties and replace every placeholder.
# The datasource and Flyway share this identity. Prefer sslmode=verify-full with a trusted CA.
CRYPTO_RESEARCH_MANAGED_DB_URL=jdbc:postgresql://<host>:<port>/<database>?sslmode=verify-full&sslrootcert=<absolute-ca-certificate-path>
CRYPTO_RESEARCH_MANAGED_DB_USERNAME=<database-username>
CRYPTO_RESEARCH_MANAGED_DB_PASSWORD=<database-password>
