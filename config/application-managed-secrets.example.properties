# Copy these keys into application-managed-secrets.properties and replace every placeholder.
# Keep both JDBC URLs on the same PostgreSQL database. Prefer sslmode=verify-full with a trusted CA.
CRYPTO_RESEARCH_MANAGED_DB_URL=jdbc:postgresql://<host>:<port>/<database>?sslmode=verify-full&sslrootcert=<absolute-ca-certificate-path>
CRYPTO_RESEARCH_MANAGED_DB_USERNAME=<runtime-username>
CRYPTO_RESEARCH_MANAGED_DB_PASSWORD=<runtime-password>
CRYPTO_RESEARCH_MANAGED_FLYWAY_URL=jdbc:postgresql://<host>:<port>/<database>?sslmode=verify-full&sslrootcert=<absolute-ca-certificate-path>
CRYPTO_RESEARCH_MANAGED_FLYWAY_USERNAME=<migration-username>
CRYPTO_RESEARCH_MANAGED_FLYWAY_PASSWORD=<migration-password>
