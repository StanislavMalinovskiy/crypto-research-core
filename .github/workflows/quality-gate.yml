name: quality-gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify test integrity
        run: pwsh -NoProfile -File .codex/scripts/verify-test-integrity.ps1

      - name: Verify Maven build
        run: ./mvnw clean verify

      - name: Run portable Node research tests
        if: ${{ always() }}
        run: |
          mkdir -p research-node-reports
          if node --test tools/research/r1/test/*.test.cjs > research-node-reports/portable-node-tests.log 2>&1; then
            test_status=0
          else
            test_status=$?
          fi
          cat research-node-reports/portable-node-tests.log
          printf '%s\n' "$test_status" > research-node-reports/exit-code.txt
          exit "$test_status"

      - name: Install OpenSpec
        if: ${{ always() }}
        run: npm install --global @fission-ai/openspec@1.13.0

      - name: Validate OpenSpec
        if: ${{ always() }}
        run: openspec validate --all --strict --no-interactive

      - name: Diagnose OpenSpec
        if: ${{ always() }}
        run: openspec doctor

      - name: Upload Maven test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload portable Node test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-node-test-results
          path: research-node-reports/**
          if-no-files-found: error
          retention-days: 14
