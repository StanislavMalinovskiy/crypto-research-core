services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_research}
      POSTGRES_USER: ${POSTGRES_USER:-crypto_research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto_research}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username=${POSTGRES_USER:-crypto_research} --dbname=${POSTGRES_DB:-crypto_research}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
